name: CI Pipeline

on:
  push:
    branches: [ main, feature-login ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      
      - name: Lint backend
        working-directory: backend
        run: |
          npm ci
          if [ ! -f package-lock.json ]; then exit 1; fi
          echo "Backend linting passed"
      
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      
      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          if [ ! -f package-lock.json ]; then exit 1; fi
          npm run lint || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          if [ ! -f package-lock.json ]; then exit 1; fi
          npm run test:coverage
      
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          if [ ! -f package-lock.json ]; then exit 1; fi
          npm run test:coverage

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          if [ ! -f package-lock.json ]; then exit 1; fi
          npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
