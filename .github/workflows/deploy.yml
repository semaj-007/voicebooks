name: Deploy Application

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      
      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

  deploy-backend:
    name: Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci --production
        
      - name: Deploy to production
        working-directory: backend
        run: |
          # Add your deployment commands here
          # For example, if using a platform like:
          # - Render: echo "Deploying to Render..."
          # - Heroku: git push heroku main
          # - AWS: aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
          echo "Backend deployment would run here"
          echo "Add your specific deployment commands for your hosting provider"
        env:
          NODE_ENV: production

  deploy-frontend:
    name: Deploy Frontend
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        
      - name: Deploy to production
        working-directory: frontend
        run: |
          # Add your frontend deployment commands here
          # For example:
          # - Netlify: netlify deploy --prod --dir=dist
          # - Vercel: vercel --prod
          # - GitHub Pages: gh-pages -d dist
          # - AWS S3: aws s3 sync dist/ s3://your-bucket
          echo "Frontend deployment would run here"
          echo "Add your specific deployment commands for your hosting provider"
        env:
          NODE_ENV: production
